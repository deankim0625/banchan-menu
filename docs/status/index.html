<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>마니반찬 진행 현황</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 지금 단계 요약 → 단계 막대 → 오늘 가게(실시간) → 지금 할 일 → 링크·파일 → 정할 것·기록 */
:root{
  --bg:#fff8e6; --card:#ffffff; --ink:#4a2f1b; --muted:#8a6f55; --line:#ecdcbc;
  --tomato:#dc5a35; --tomato-soft:#fde6dc; --butter:#ffe7a3; --green:#2f7a3d; --green-soft:#e2f2e3;
  --display:"Jua","Noto Sans KR",sans-serif; --body:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#1c1712; --card:#27201a; --ink:#f3e7d6; --muted:#bba68d; --line:#3d3226;
  --tomato:#f07a55; --tomato-soft:#43281d; --butter:#4a3c1c; --green:#7fc48a; --green-soft:#21331f; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:880px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px}
h1{font-family:var(--display);font-weight:400;font-size:2.1rem;line-height:1.1;margin:0}
h1 span{color:var(--tomato)}
.upd{color:var(--muted);font-size:.9rem}
h2{font-family:var(--display);font-weight:400;font-size:1.35rem;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px}
.hero{display:grid;grid-template-columns:1fr auto;gap:14px 20px;align-items:center}
.hero .now{font-size:.95rem;color:var(--muted);margin:0}
.hero .phase{font-family:var(--display);font-size:1.7rem;margin:2px 0 4px}
.hero .goal{margin:0}
.ring{width:108px;height:108px}
.ring text{font-family:var(--display)}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.step{border-radius:14px;padding:10px 10px 12px;border:2px solid var(--line);background:var(--card);min-width:0}
.step.done{border-color:var(--green);background:var(--green-soft)}
.step.now{border-color:var(--tomato);background:var(--tomato-soft)}
.step b{display:block;font-size:.88rem;line-height:1.3;word-break:keep-all}
.step small{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}
.bar{height:8px;border-radius:99px;background:var(--line);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px}
.step.now .bar i{background:var(--tomato)}
.live{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.live div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.live b{display:block;font-family:var(--display);font-size:1.8rem;font-weight:400;line-height:1.1;font-variant-numeric:tabular-nums}
.live span{color:var(--muted);font-size:.88rem}
ul.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ul.tasks li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
ul.tasks li:first-child{border-top:none}
.box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center;font-size:15px;font-weight:700;margin-top:1px}
li.ok .box{border-color:var(--green);background:var(--green);color:var(--card)}
li.ok .t{color:var(--muted)}
.who{margin-left:auto;flex:none;font-size:.8rem;background:var(--butter);border-radius:99px;padding:2px 10px;white-space:nowrap}
details{border-top:1px solid var(--line);padding:10px 0}
details:first-of-type{border-top:none}
summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::-webkit-details-marker{display:none}
summary small{color:var(--muted);font-weight:400}
details ul.tasks{margin-top:6px}
.links{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
a.link{display:flex;flex-direction:column;gap:2px;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-width:0}
a.link:hover{border-color:var(--tomato)}
a.link b{font-size:1.02rem}
a.link b::after{content:" ↗";color:var(--tomato)}
a.link span{color:var(--muted);font-size:.88rem}
a.link em{font-style:normal;align-self:flex-start;font-size:.75rem;background:var(--butter);border-radius:99px;padding:1px 9px;margin-bottom:4px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
a.tile{display:flex;flex-direction:column;text-decoration:none;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:18px;overflow:hidden;min-width:0;transition:transform .15s,border-color .15s,box-shadow .15s}
a.tile:hover{transform:translateY(-3px);border-color:var(--tomato);box-shadow:0 8px 20px rgba(90,58,34,.12)}
.thumb{aspect-ratio:16/10;max-width:100%;background:var(--butter);overflow:hidden;position:relative;border-bottom:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.thumb.contain img{object-fit:contain;object-position:center}
.thumb em{position:absolute;left:10px;top:10px;font-style:normal;font-size:.75rem;font-weight:700;background:var(--card);color:var(--ink);border-radius:99px;padding:2px 10px}
.tbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.tbody b{font-size:1.05rem}
.tbody span{color:var(--muted);font-size:.86rem}
.tbody .est{color:var(--ink);font-size:.86rem;background:var(--butter);border-radius:8px;padding:4px 8px;margin-top:2px}
.open{margin-top:auto;align-self:flex-start;padding-top:8px;font-weight:700;color:var(--tomato);font-size:.9rem}
.divider{display:flex;align-items:center;gap:12px;margin-top:10px}
.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.divider h2{margin:0}
.lb{position:fixed;inset:0;z-index:50;background:rgba(20,14,8,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.lb img{max-width:100%;max-height:calc(100vh - 110px);border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.5);background:#fff}
.lb p{margin:0;color:#fff;font-weight:700;text-align:center}
.lb button{font:inherit;font-weight:700;border:none;border-radius:99px;padding:10px 22px;background:#fff;color:#4a2f1b;cursor:pointer}
@media (max-width:760px){.tiles{grid-template-columns:1fr 1fr}}
@media (max-width:460px){.tiles{grid-template-columns:1fr}}
.plain{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}
.plain span{color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.log time{display:block;color:var(--muted);font-size:.82rem;font-variant-numeric:tabular-nums}
.err{color:var(--tomato)}
/* 사업 계획 */
.vision{font-family:var(--display);font-size:1.25rem;line-height:1.4;margin:0 0 14px;word-break:keep-all}
.vision em{font-style:normal;color:var(--tomato)}
.stages{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stage{border:2px solid var(--line);border-radius:16px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stage.now{border-color:var(--tomato);background:var(--tomato-soft)}
.stage b{font-family:var(--display);font-weight:400;font-size:1.15rem}
.stage small{color:var(--muted)}
.stage ul{margin:0;padding-left:1.1em;font-size:.92rem}
.stage .mom{font-size:.86rem;background:var(--butter);border-radius:8px;padding:4px 8px}
.stage .gate{margin-top:auto;font-size:.84rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.weeks{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.weeks div{border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.weeks b{display:block;font-size:.95rem;margin-bottom:4px}
.weeks ul{margin:0;padding-left:1.05em;font-size:.86rem;color:var(--muted)}
table.kpi{width:100%;border-collapse:collapse;font-size:.92rem;margin-top:6px}
table.kpi th,table.kpi td{text-align:left;padding:7px 6px;border-top:1px solid var(--line);vertical-align:top}
table.kpi th{color:var(--muted);font-weight:500;font-size:.82rem;border-top:none}
.plan-sub{font-family:var(--display);font-weight:400;font-size:1.1rem;margin:18px 0 6px}
@media (max-width:760px){.stages{grid-template-columns:1fr}.weeks{grid-template-columns:1fr 1fr}}
@media (max-width:460px){.weeks{grid-template-columns:1fr}}
a:focus-visible,summary:focus-visible{outline:2px solid var(--tomato);outline-offset:3px;border-radius:8px}
@media (max-width:640px){
  .steps{grid-template-columns:1fr 1fr}
  .live,.links,.two{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr}
  .ring{justify-self:start}
}
</style>
</head>
<body>
<div class="wrap" id="app"><p>진행 현황을 불러오는 중이에요…</p></div>
<script>
const API = "https://script.google.com/macros/s/AKfycby13vkWEGQjW1dySnWUpKUvfoRWa7gtQDvf2wco7jG8W6mps8HmaCA4G5lO5KQkAldX/exec";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safe = u => /^https:\/\/[^\s"'<>]+$/.test(u || "") ? u : "#";
const pct = p => p.tasks.length ? Math.round(100 * p.tasks.filter(t => t.done).length / p.tasks.length) : 0;
const fmtDate = s => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ""); return m ? `${+m[2]}월 ${+m[3]}일` : esc(s); };

function taskList(tasks){
  return `<ul class="tasks">${tasks.map(t => `<li class="${t.done ? "ok" : ""}"><span class="box">${t.done ? "✓" : ""}</span><span class="t">${esc(t.t)}</span>${t.who ? `<span class="who">${esc(t.who)}</span>` : ""}</li>`).join("")}</ul>`;
}
function ring(p){
  const r = 44, c = 2 * Math.PI * r, d = c * p / 100;
  return `<svg class="ring" viewBox="0 0 108 108" role="img" aria-label="전체 진행률 ${p}%"><circle cx="54" cy="54" r="${r}" fill="none" stroke="var(--line)" stroke-width="10"/><circle cx="54" cy="54" r="${r}" fill="none" stroke="var(--tomato)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${d} ${c}" transform="rotate(-90 54 54)"/><text x="54" y="60" text-anchor="middle" font-size="22" fill="var(--ink)">${p}%</text></svg>`;
}

function tiles(list, btn){
  return `<div class="tiles">${list.map(p => `
    <a class="tile" href="${/^[\w.\/-]+\.(png|jpe?g)$/i.test(p.url) ? esc(p.url) : safe(p.url)}" target="_blank" rel="noopener" ${/^[\w.\/-]+\.(png|jpe?g)$/i.test(p.url) ? `data-lb="${esc(p.url)}" data-cap="${esc(p.name)}" data-pdf="${p.pdf ? safe(p.pdf) : ""}"` : ""}>
      <div class="thumb ${p.fit === "contain" ? "contain" : ""}">${p.thumb ? `<img src="${esc(p.thumb)}" alt="${esc(p.name)} 미리보기" loading="lazy">` : ""}${p.who ? `<em>${esc(p.who)}</em>` : ""}</div>
      <div class="tbody"><b>${esc(p.name)}</b><span>${esc(p.desc)}</span>${p.est ? `<span class="est">예상 비용 ${esc(p.est)}</span>` : ""}<span class="open">${btn} ↗</span></div>
    </a>`).join("")}</div>`;
}

// 사업 계획 요약: 비전 → 3단계(넘어가는 조건) → 12주 계획 → 알게 된 것 → 볼 숫자
function planCard(p){
  const li = a => (a || []).map(x => `<li>${esc(x)}</li>`).join("");
  return `<section class="card" aria-label="사업 계획"><h2>사업 계획</h2>
    <p class="vision">${esc(p.vision)}</p>
    <div class="stages">${p.stages.map(st => `
      <div class="stage ${st.now ? "now" : ""}"><b>${esc(st.name)}</b><small>${esc(st.period)}</small><ul>${li(st.items)}</ul>
        <span class="mom">엄마 역할: ${esc(st.mom)}</span>${st.gate ? `<span class="gate">다음 단계로: ${esc(st.gate)}</span>` : ""}</div>`).join("")}</div>
    <p class="plan-sub">앞으로 12주</p>
    <div class="weeks">${p.weeks.map(w => `<div><b>${esc(w.label)}</b><ul>${li(w.items)}</ul></div>`).join("")}</div>
    ${p.found && p.found.length ? `<p class="plan-sub">알게 된 것</p><ul class="plain">${li(p.found)}</ul>` : ""}
    <p class="plan-sub">매주 볼 숫자</p>
    <table class="kpi"><thead><tr><th>숫자</th><th>지금</th><th>12주 목표 (제안)</th></tr></thead><tbody>${p.kpis.map(k => `<tr><td>${esc(k.name)}</td><td>${esc(k.now)}</td><td>${esc(k.goal)}</td></tr>`).join("")}</tbody></table>
  </section>`;
}

function render(s, live){
  const all = s.phases.flatMap(p => p.tasks), total = Math.round(100 * all.filter(t => t.done).length / all.length);
  const now = s.phases.find(p => p.status === "now") || s.phases[0];
  const later = s.phases.filter(p => p.status === "next");
  document.getElementById("app").innerHTML = `
    <header><h1><span>마니반찬</span> 진행 현황</h1><span class="upd">${fmtDate(s.updated)} 업데이트</span></header>

    ${s.plan ? planCard(s.plan) : ""}

    <section aria-label="웹페이지"><h2>웹페이지</h2>${tiles(s.pages, "열기")}</section>

    ${s.prints && s.prints.length ? `<section aria-label="가게 인쇄물"><h2>가게에 붙이고 세울 것</h2>${tiles(s.prints, "크게 보기")}</section>` : ""}

    ${s.labels && s.labels.length ? `<section aria-label="라벨 자동화"><h2>라벨 자동화 미리보기</h2>${tiles(s.labels, "크게 보기")}</section>` : ""}

    <section aria-label="파일"><h2>만든 파일</h2>${tiles(s.files, "보기")}</section>

    <div class="divider"><h2>작업 현황</h2></div>

    <section class="card hero" aria-label="지금 단계">
      <div><p class="now">지금 하고 있는 단계</p><p class="phase">${esc(now.name)}</p><p class="goal">${esc(now.goal)}</p></div>
      ${ring(total)}
    </section>

    <section aria-label="단계별 진행"><div class="steps">${s.phases.map(p => `
      <div class="step ${p.status}"><b>${esc(p.name)}</b><small>${p.status === "done" ? "완료" : p.status === "now" ? "진행 중 · " + esc(p.period) : esc(p.period)}</small><div class="bar"><i style="width:${pct(p)}%"></i></div></div>`).join("")}</div></section>

    <section aria-label="오늘 가게"><h2>오늘 가게</h2><div class="live">${live ? `
      <div><b>${live.on}가지</b><span>지금 파는 반찬</span></div>
      <div><b>${live.out}가지</b><span>다 팔린 반찬</span></div>
      <div><b>${live.when || "아직 없음"}</b><span>엄마가 마지막으로 바꾼 시각</span></div>` : live === undefined ? `<div style="grid-column:1/-1"><span>가게 정보를 불러오는 중이에요…</span></div>` : `<div class="err" style="grid-column:1/-1">지금은 가게 정보를 불러오지 못했어요.</div>`}</div></section>

    <section class="card" aria-label="지금 할 일"><h2>지금 할 일 · ${esc(now.name)}</h2>${taskList(now.tasks)}</section>

    <section class="card" aria-label="다음 단계"><h2>다음 단계</h2>${later.map(p => `
      <details><summary>${esc(p.name)} <small>${esc(p.period)} · 목표: ${esc(p.goal)}</small></summary>${taskList(p.tasks)}</details>`).join("")}
      ${s.phases.filter(p => p.status === "done").map(p => `
      <details><summary>${esc(p.name)} ✓ <small>${esc(p.period)} · 완료</small></summary>${taskList(p.tasks)}</details>`).join("")}
    </section>

    <div class="two">
      <section class="card" aria-label="정해야 할 것"><h2>정해야 할 것</h2><ul class="plain">${s.decisions.map(d => `<li>${esc(d)}</li>`).join("")}</ul></section>
      <section class="card" aria-label="최근 한 일"><h2>최근 한 일</h2><ul class="log">${s.log.map(l => `<li><time>${fmtDate(l.date)}</time>${esc(l.text)}</li>`).join("")}</ul></section>
    </div>

    <section class="card" aria-label="로그인이 필요한 것"><h2>내 계정으로만 열리는 것</h2><ul class="plain">${s.private.map(p => `<li><b>${esc(p.name)}</b> <span>· ${esc(p.desc)}</span></li>`).join("")}</ul></section>`;
}

document.addEventListener("click", e => {
  const a = e.target.closest("a[data-lb]");
  if (a) {
    e.preventDefault();
    const box = document.createElement("div");
    box.className = "lb"; box.setAttribute("role", "dialog"); box.setAttribute("aria-label", a.dataset.cap);
    const pdf = a.dataset.pdf && a.dataset.pdf !== "#" ? `<a href="${esc(a.dataset.pdf)}" target="_blank" rel="noopener" style="color:#ffe7a3;font-weight:700">인쇄용 PDF 열기 ↗</a>` : "";
    box.innerHTML = `<img src="${esc(a.dataset.lb)}" alt="${esc(a.dataset.cap)}"><p>${esc(a.dataset.cap)}</p>${pdf}<button type="button">닫기</button>`;
    document.body.appendChild(box);
    box.querySelector("button").focus();
    return;
  }
  const lb = e.target.closest(".lb");
  if (lb && (e.target === lb || e.target.tagName === "BUTTON")) lb.remove();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") document.querySelector(".lb")?.remove(); });

async function getLive(){
  try{
    const r = await fetch(API, {cache:"no-store"}); if(!r.ok) throw 0;
    const j = await r.json(), items = j.items || [];
    let when = "";
    if (j.updatedAt){ const d = new Date(j.updatedAt); if(!isNaN(d)){ const h = d.getHours(); when = `${d.getMonth()+1}/${d.getDate()} ${h<12?"오전":"오후"} ${h%12||12}:${String(d.getMinutes()).padStart(2,"0")}`; } }
    return { on: items.filter(i => Number(i.left) > 0).length, out: items.filter(i => !(Number(i.left) > 0)).length, when };
  }catch(e){ return null; }
}

(async () => {
  let s;
  try { const r = await fetch("status.json", {cache:"no-store"}); s = await r.json(); }
  catch(e){ document.getElementById("app").innerHTML = '<p class="err">진행 현황을 불러오지 못했어요. 잠시 뒤 새로고침해 주세요.</p>'; return; }
  render(s, undefined);
  render(s, await getLive());
})();
</script>
</body>
</html>
