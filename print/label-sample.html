<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>마니반찬 반찬 라벨 62x40</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap">
<style>
  /* 감열 라벨 62 x 40 mm · 흑백 */
  @page { size: 62mm 40mm; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #fff; }
  body { font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; color: #000; }
  .label { width: 62mm; height: 40mm; padding: 2.2mm 2.4mm 2mm; display: grid; grid-template-columns: 1fr 17mm; gap: 1.6mm; background: #fff; }
  .l { display: flex; flex-direction: column; gap: .5mm; min-width: 0; }
  .shop { font-size: 5.5pt; font-weight: 700; letter-spacing: .02em; }
  .name { font-size: 12pt; font-weight: 900; line-height: 1.05; }
  .price { font-size: 7.5pt; font-weight: 700; }
  .date { margin-top: .4mm; border-top: .25mm solid #000; padding-top: .6mm; font-size: 6pt; line-height: 1.3; }
  .date b { font-size: 7pt; font-weight: 900; }
  .small { font-size: 4.6pt; line-height: 1.3; }
  .r { display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
  #qr { width: 17mm; height: 17mm; }
  #qr img, #qr canvas { width: 17mm !important; height: 17mm !important; display: block; }
  .code { font-size: 4.6pt; font-family: Consolas, monospace; text-align: center; }
  .keep { font-size: 5pt; font-weight: 700; border: .25mm solid #000; border-radius: 1mm; padding: .3mm .8mm; text-align: center; }
</style>
</head>
<body>
<div class="label">
  <div class="l">
    <div class="shop">마니반찬</div>
    <div class="name">시금치나물</div>
    <div class="price">200g · 4,000원</div>
    <div class="date">제조일 2026.11.18<br><b>소비기한 2026.11.21까지</b></div>
    <div class="small">원재료: 시금치(국산), 참기름, 깨, 간장, 마늘<br>알레르기: 대두, 밀, 참깨 함유<br>마니반찬 · 010-4110-7115</div>
  </div>
  <div class="r">
    <div id="qr"></div>
    <div class="code">M-1118-01-03</div>
    <div class="keep">냉장 0~10℃</div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  new QRCode(document.getElementById("qr"), { text: "M-1118-01-03", width: 256, height: 256, colorDark: "#000", colorLight: "#fff", correctLevel: QRCode.CorrectLevel.M });
</script>
</body>
</html>
