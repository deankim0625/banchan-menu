<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>마니반찬 뚜껑 스티커 원형 50mm</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
  /* 뚜껑 스티커 · 지름 50mm 원형 (재단 여백 2mm 포함 54mm) */
  @page { size: 54mm 54mm; margin: 0; }
  :root { --bg:#ffe7a3; --brown:#5a3a22; --tomato:#dc5a35; --cream:#fff8e6; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { font-family: "Gowun Dodum", "Malgun Gothic", sans-serif; color: var(--brown); }
  .sheet { width: 54mm; height: 54mm; display: grid; place-items: center; }
  .s { width: 54mm; height: 54mm; border-radius: 50%; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .8mm; text-align: center; border: 2mm solid var(--bg); outline: .6mm solid var(--tomato); outline-offset: -3.4mm; }
  .s svg { width: 11mm; height: 9mm; color: var(--tomato); }
  .s b { font-family: "Jua", sans-serif; font-weight: 400; font-size: 17pt; line-height: 1; }
  .s em { font-style: normal; font-size: 7.5pt; }
  .s small { font-size: 6pt; color: #7a5a3e; }
</style>
</head>
<body>
<div class="sheet"><div class="s">
  <svg viewBox="0 0 160 126"><path d="M52 34c-10-10 10-16 0-28M80 32c-10-10 10-16 0-28M108 34c-10-10 10-16 0-28" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round"/><path d="M8 56h144c0 34-32 58-72 58S8 90 8 56z" fill="currentColor"/><rect x="54" y="112" width="52" height="10" rx="5" fill="currentColor"/></svg>
  <b>마니반찬</b>
  <em>짜지 않은 집밥 반찬</em>
  <small>선학로 101 · 010-4110-7115</small>
</div></div>
</body>
</html>
