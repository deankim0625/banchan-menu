<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>마니반찬 단골톡방 QR</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
  /* 따뜻한 집밥 스타일 (톡방 대표·공지 이미지와 같은 색) */
  @page { size: A4 portrait; margin: 0; }
  :root { --bg:#ffe7a3; --brown:#5a3a22; --tomato:#dc5a35; --cream:#fff8e6; --soft:#f6d27a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { font-family: "Gowun Dodum", "Malgun Gothic", sans-serif; color: var(--brown); }
  .page { width: 210mm; height: 297mm; margin: 0 auto; background: var(--bg); display: flex; flex-direction: column; align-items: center; padding: 18mm 16mm 14mm; gap: 7mm; text-align: center; position: relative; overflow: hidden; }
  .brand { display: flex; align-items: center; gap: 4mm; }
  .brand svg { width: 22mm; height: 17mm; color: var(--tomato); }
  .brand span { font-family: "Jua", sans-serif; font-size: 30pt; }
  h1 { font-family: "Jua", sans-serif; font-weight: 400; font-size: 52pt; line-height: 1.12; }
  h1 em { font-style: normal; color: var(--tomato); }
  .card { background: var(--cream); border-radius: 12mm; padding: 9mm 9mm 7mm; display: flex; flex-direction: column; align-items: center; gap: 4mm; }
  .card img { width: 108mm; height: 108mm; display: block; border-radius: 4mm; background: #fff; }
  .scan { font-family: "Jua", sans-serif; font-size: 20pt; color: var(--tomato); }
  ul { list-style: none; display: flex; flex-direction: column; gap: 3mm; text-align: left; font-size: 17pt; line-height: 1.35; }
  li { padding-left: 9mm; position: relative; }
  li::before { content: ""; position: absolute; left: 0; top: .32em; width: 5mm; height: 5mm; border-radius: 50%; background: var(--soft); }
  .foot { margin-top: auto; display: flex; gap: 4mm; font-size: 14pt; }
  .foot div { background: var(--brown); color: var(--cream); border-radius: 6mm; padding: 3mm 7mm; }
  .foot b { font-family: "Jua", sans-serif; font-weight: 400; color: var(--soft); margin-right: 2mm; }
</style>
</head>
<body>
<div class="page">
  <div class="brand">
    <svg viewBox="0 0 160 126"><path d="M52 34c-10-10 10-16 0-28M80 32c-10-10 10-16 0-28M108 34c-10-10 10-16 0-28" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"/><path d="M8 56h144c0 34-32 58-72 58S8 90 8 56z" fill="currentColor"/><rect x="54" y="112" width="52" height="10" rx="5" fill="currentColor"/></svg>
    <span>마니반찬</span>
  </div>
  <h1>오늘 반찬 소식,<br><em>단골 톡방</em>에서 받아요</h1>
  <div class="card">
    <img src="images/kakao-openchat-qr.png" alt="마니반찬 단골방 카카오톡 오픈채팅 QR">
    <p class="scan">카메라로 찍으면 바로 들어와요</p>
  </div>
  <ul>
    <li>아침마다 오늘 만든 반찬을 올려 드려요</li>
    <li>톡으로 미리 예약하고 찾아가세요</li>
    <li>먹고 싶은 반찬, 편하게 말씀해 주세요</li>
  </ul>
  <div class="foot">
    <div><b>영업</b>오전 8시 ~ 저녁 8시 · 일요일 휴무</div>
    <div><b>전화</b>010-4110-7115</div>
  </div>
</div>
</body>
</html>
